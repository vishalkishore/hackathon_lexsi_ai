# Mechanism on the 333 correction pairs. build_cache: true runs the GPU activation pass first.
build_cache: false
correction:
  heretic: data/aya8b-hindi-safety-prompts/data/heretic/pairs_main_prefixes.parquet
  prefixes: data/aya8b-hindi-safety-prompts/data/prefixes.parquet
cache: runs/multiturn_v2/m0_cache/base
pairs: runs/multiturn_v2/m0_cache/pairs.json
